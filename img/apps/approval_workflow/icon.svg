<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 256 256" width="256" height="256">
  <title>Approval Workflow Engine</title>
  <defs>
    <linearGradient id="stampFill" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#FFB547"/>
      <stop offset="1" stop-color="#FF8A1F"/>
    </linearGradient>
  </defs>
  <style>
    /* One cycle: the stamp comes down and presses, then the ring and the check are drawn. */
    .stamp, .ring, .check, .ink { transform-box: view-box; }
    .stamp { transform-origin: 186px 236px; animation: press 3.2s ease-in-out infinite; }
    .ring { stroke-dasharray: 1; animation: draw-ring 3.2s ease-out infinite; }
    .check { stroke-dasharray: 1; animation: draw-check 3.2s ease-out infinite; }
    .ink { transform-origin: 186px 232px; opacity: 0; animation: ink 3.2s ease-out infinite; }
    @keyframes press {
      0%, 6% { transform: translate(16px, -34px) rotate(14deg); }
      22% { transform: translate(0, 4px) rotate(0) scale(1.04, 0.92); }
      28% { transform: translate(0, 0) rotate(0) scale(1); }
      90% { transform: translate(0, 0) rotate(0); }
      100% { transform: translate(16px, -34px) rotate(14deg); }
    }
    @keyframes draw-ring {
      0%, 24% { stroke-dashoffset: 1; }
      50%, 92% { stroke-dashoffset: 0; }
      100% { stroke-dashoffset: 1; }
    }
    @keyframes draw-check {
      0%, 44% { stroke-dashoffset: 1; }
      60%, 92% { stroke-dashoffset: 0; }
      100% { stroke-dashoffset: 1; }
    }
    @keyframes ink {
      0%, 20% { opacity: 0; transform: scale(0.6); }
      26% { opacity: 0.9; transform: scale(1.15); }
      40%, 100% { opacity: 0; transform: scale(1.4); }
    }
    @media (prefers-reduced-motion: reduce) {
      .stamp, .ring, .check, .ink { animation: none; }
      .ring, .check { stroke-dashoffset: 0; }
    }
  </style>

  <!-- ring: dark outline underneath, green on top; both drawn together -->
  <g fill="none" stroke-linecap="round" transform="rotate(-90 112 108)">
    <circle class="ring" pathLength="1" cx="112" cy="108" r="80" stroke="#1F1F2B" stroke-width="40"/>
    <circle class="ring" pathLength="1" cx="112" cy="108" r="80" stroke="#2FCB8A" stroke-width="24"/>
  </g>
  <!-- inner fill so the check sits on a soft disc -->
  <circle cx="112" cy="108" r="56" fill="#E8FBF2" stroke="#1F1F2B" stroke-width="8"/>

  <!-- check mark: outline + green -->
  <g fill="none" stroke-linecap="round" stroke-linejoin="round">
    <path class="check" pathLength="1" d="M78 108 L 103 133 L 148 86" stroke="#1F1F2B" stroke-width="30"/>
    <path class="check" pathLength="1" d="M78 108 L 103 133 L 148 86" stroke="#2FCB8A" stroke-width="16"/>
  </g>

  <!-- ink splash where the stamp lands -->
  <ellipse class="ink" cx="186" cy="234" rx="52" ry="10" fill="#4C6EF5"/>

  <!-- stamp -->
  <g class="stamp" stroke="#1F1F2B" stroke-width="8" stroke-linejoin="round" stroke-linecap="round">
    <rect x="138" y="222" width="96" height="16" rx="5" fill="#4C6EF5"/>
    <path d="M146 222 L 146 206 C 146 198 152 192 160 192 L 212 192 C 220 192 226 198 226 206 L 226 222 Z" fill="url(#stampFill)"/>
    <path d="M174 192 L 176 166 L 196 166 L 198 192 Z" fill="#FF9F2E"/>
    <circle cx="186" cy="146" r="26" fill="url(#stampFill)"/>
    <circle cx="186" cy="146" r="9" fill="#D0EBFF"/>
  </g>
</svg>

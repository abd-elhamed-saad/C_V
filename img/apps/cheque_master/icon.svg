<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 256 256" width="256" height="256">
  <title>Cheque Master</title>
  <defs>
    <linearGradient id="paper" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#FFFFFF"/>
      <stop offset="1" stop-color="#E7EEF7"/>
    </linearGradient>
    <linearGradient id="band" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#1CA7D8"/>
      <stop offset="1" stop-color="#A8D84B"/>
    </linearGradient>
    <clipPath id="card">
      <path d="M40 78 L 186 78 L 216 108 L 216 186 C 216 192 212 196 206 196 L 40 196 C 34 196 30 192 30 186 L 30 88 C 30 82 34 78 40 78 Z"/>
    </clipPath>
  </defs>
  <style>
    /* One cycle: the cheque floats in, it gets signed, then the "cleared" badge pops in. */
    .cheque, .sign, .badge { transform-box: view-box; }
    .cheque { transform-origin: 123px 137px; animation: float 3.2s ease-in-out infinite; }
    .sign { stroke-dasharray: 1; animation: sign 3.2s ease-in-out infinite; }
    .amount { animation: amount 3.2s steps(1) infinite; }
    .badge { transform-origin: 196px 192px; animation: pop 3.2s ease-out infinite; }
    @keyframes float {
      0% { transform: translate(-14px, 10px) rotate(-10deg); opacity: 0; }
      12% { transform: translate(0, 0) rotate(-6deg); opacity: 1; }
      60% { transform: translate(0, -4px) rotate(-6deg); }
      92% { transform: translate(0, 0) rotate(-6deg); opacity: 1; }
      100% { transform: translate(14px, -8px) rotate(-2deg); opacity: 0; }
    }
    @keyframes sign {
      0%, 18% { stroke-dashoffset: 1; }
      46%, 100% { stroke-dashoffset: 0; }
    }
    @keyframes amount {
      0% { opacity: 0; }
      16%, 100% { opacity: 1; }
    }
    @keyframes pop {
      0%, 48% { transform: scale(0); }
      56% { transform: scale(1.2); }
      62%, 90% { transform: scale(1); }
      100% { transform: scale(0); }
    }
    @media (prefers-reduced-motion: reduce) {
      .cheque, .sign, .amount, .badge { animation: none; }
      .cheque { transform: rotate(-6deg); }
      .sign { stroke-dashoffset: 0; }
    }
  </style>

  <g class="cheque">
    <!-- paper with a folded top-right corner -->
    <path fill="url(#paper)" stroke="#1F1F2B" stroke-width="9" stroke-linejoin="round"
          d="M40 78 L 186 78 L 216 108 L 216 186 C 216 192 212 196 206 196 L 40 196 C 34 196 30 192 30 186 L 30 88 C 30 82 34 78 40 78 Z"/>
    <!-- colored strip on the left -->
    <rect x="30" y="78" width="46" height="118" fill="url(#band)" clip-path="url(#card)"/>
    <path d="M76 82 L 76 192" stroke="#1F1F2B" stroke-width="4"/>
    <!-- bank logo -->
    <circle cx="53" cy="104" r="11" fill="#FFFFFF" opacity="0.9"/>
    <path d="M47 108 L 53 98 L 59 108 Z" fill="#1CA7D8"/>
    <!-- fold -->
    <path d="M186 78 L 186 100 C 186 104 190 108 194 108 L 216 108 Z" fill="#C9D6E6" stroke="#1F1F2B" stroke-width="7" stroke-linejoin="round"/>
    <!-- text lines -->
    <g stroke="#9AA9BC" stroke-width="5" stroke-linecap="round">
      <path d="M90 100 L 140 100"/>
      <path d="M90 126 L 170 126"/>
      <path d="M90 146 L 196 146"/>
    </g>
    <!-- amount box -->
    <rect x="166" y="114" width="40" height="20" rx="5" fill="#FFFFFF" stroke="#1F1F2B" stroke-width="5"/>
    <path class="amount" d="M174 124 L 198 124" stroke="#2FA36B" stroke-width="5" stroke-linecap="round"/>
    <!-- signature -->
    <path d="M128 182 L 200 182" stroke="#1F1F2B" stroke-width="4" stroke-linecap="round" opacity="0.5"/>
    <path class="sign" pathLength="1" fill="none" stroke="#3B5BDB" stroke-width="6" stroke-linecap="round" stroke-linejoin="round"
          d="M132 176 C 138 160 146 160 144 172 C 142 182 150 182 156 168 C 160 160 164 176 170 172 C 176 168 180 164 192 170"/>
  </g>

  <!-- cleared badge -->
  <g class="badge">
    <circle cx="196" cy="192" r="30" fill="#2FCB8A" stroke="#1F1F2B" stroke-width="9"/>
    <path d="M182 192 L 192 202 L 210 182" fill="none" stroke="#FFFFFF" stroke-width="9" stroke-linecap="round" stroke-linejoin="round"/>
  </g>
</svg>
